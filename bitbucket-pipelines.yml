image: node:22

definitions:
  caches:
    npm: ~/.npm
  steps:
    - step: &validate
        name: Lint, typecheck e build
        caches:
          - npm
        script:
          # npm ci exige o package-lock.json versionado
          - npm ci
          - npm run lint
          # "npm run build" ja roda "tsc -b" antes do vite build
          - npm run build
        artifacts:
          - dist/**

    - step: &docker-build
        name: Validar build da imagem Docker
        services:
          - docker
        caches:
          - docker
        script:
          # Garante que o Dockerfile continua construindo antes de liberar o deploy
          - docker build -t site-veritas:$BITBUCKET_COMMIT .

    - step: &deploy-production
        name: Deploy em producao
        deployment: production
        trigger: manual
        clone:
          enabled: false
        script:
          # O servidor faz git pull e reconstroi a imagem localmente (sem registry).
          # Requer: chave SSH do repositorio autorizada no servidor e no host de destino,
          # e uma deploy key do Bitbucket configurada no servidor para o git pull.
          - pipe: atlassian/ssh-run:0.8.1
            variables:
              SSH_USER: $PROD_SSH_USER
              SERVER: $PROD_SSH_HOST
              MODE: 'command'
              COMMAND: >-
                set -e &&
                cd $PROD_APP_DIR &&
                git fetch --all &&
                git reset --hard origin/master &&
                docker compose up -d --build &&
                docker image prune -f

pipelines:
  pull-requests:
    '**':
      - step: *validate

  branches:
    master:
      - step: *validate
      - step: *docker-build
      - step: *deploy-production

  # Permite disparar o deploy manualmente pela UI (Pipelines > Run pipeline)
  custom:
    deploy-production:
      - step: *validate
      - step: *docker-build
      - step: *deploy-production
